<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Админка</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<header>
    <span class="brand">Админка</span>
</header>

<main>
    <p id="busy" class="muted" hidden>Проверяем вход…</p>

    <!-- Вход: адрес сервера, почта и пароль от админки. -->
    <form id="login" hidden>
        <label>
            Адрес админки
            <input type="text" name="server" placeholder="https://admin.example.com" autocomplete="url" required>
        </label>
        <label>
            Почта
            <input type="email" name="email" autocomplete="username" required>
        </label>
        <label>
            Пароль
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="error" hidden></p>
        <button type="submit">Войти</button>
        <p class="muted small">Те же почта и пароль, что на сайте админки.</p>
    </form>

    <!-- Вошли: кто и куда. -->
    <section id="signed-in" hidden>
        <p>Вы вошли как <b id="nickname"></b> <span id="role" class="badge"></span></p>
        <p class="muted small" id="server-line"></p>
        <p id="me-warning" class="error" hidden></p>

        <!-- Раскраска карты в игре. Панель боковая и сама не закрывается:
             режимы переключают, глядя на карту. -->
        <section id="map" class="map">
            <h2>Карта партии</h2>
            <p id="map-status" class="muted"></p>
            <div class="map-actions">
                <button id="map-analyse" type="button" disabled>🔍 Анализировать карту</button>
                <button id="map-reset" type="button" class="ghost" title="Вернуть цвета игры" hidden>↺</button>
            </div>
            <div id="map-modes" class="map-modes"></div>
            <ul id="map-legend" class="map-legend"></ul>
        </section>

        <!-- Отношения с компьютерными странами: одно отношение всем сразу.
             Живых игроков кнопка не трогает — с ними договариваются. -->
        <section id="diplomacy" class="map">
            <h2>Отношения с ботами</h2>
            <p id="diplomacy-status" class="muted"></p>
            <div class="map-actions">
                <select id="diplomacy-relation" aria-label="Какое отношение выдать ботам" disabled></select>
            </div>
            <button id="diplomacy-apply" type="button" disabled>Выдать всем ботам</button>
            <p class="muted small">Отношение выдаётся односторонне: согласия ботов не нужно, и тем же списком его возвращают обратно на мир.</p>
        </section>

        <button id="logout" type="button" class="ghost">Выйти</button>
    </section>
</main>

<script src="panel-map.js"></script>
<script src="popup.js"></script>
</body>
</html>
